name: local-wordpress-703

# Local development only. Credentials come from .env (copy .env.example → .env);
# docker compose reads it automatically.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - wordpress_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      # Debug toggle: "local" environment = the theme's debug logging is on; PHP errors go to
      # wp-content/debug.log instead of being printed into pages. Production keeps WordPress
      # defaults (no debug), so nothing here applies to the live site.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      # WordPress core/plugins/uploads live in a Docker volume: a Windows-drive bind mount
      # made every page take ~4s. The old copy in D:/wordpress-7.0.3/wordpress is kept as a backup.
      - wordpress_html:/var/www/html
      # The theme lives in this repo; mounted so edits show up instantly.
      - ./theme/imp:/var/www/html/wp-content/themes/imp

volumes:
  wordpress_db:
  wordpress_html:
